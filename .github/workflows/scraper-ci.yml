name: Scraper CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r scraper/requirements-dev.txt
      - run: python -m ruff check scraper

  unit-tests:
    name: Scraper unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r scraper/requirements-dev.txt
      - run: python -m pytest -q
