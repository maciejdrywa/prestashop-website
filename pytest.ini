[pytest]
testpaths = scraper
# Przypadki integracyjne wymagają uruchomionej instancji testowej PrestaShop.
addopts =
    --disable-socket
    --ignore=scraper/test_api_client.py
    --deselect=scraper/test_category_import.py::test_prestashop_parent_child_relations
    --deselect=scraper/test_category_import.py::test_category_import_idempotence
    --deselect=scraper/test_category_import.py::test_dynamic_hierarchy_lifecycle
    --deselect=scraper/test_category_import.py::test_parent_failure_cascade_and_mapping_isolation
    --deselect=scraper/test_category_import.py::test_record_validation_rejects_nulls_and_continues_valid
    --deselect=scraper/test_category_import.py::test_foreign_category_protection_against_unverified_rename
