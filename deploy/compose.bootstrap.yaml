# Overlay uruchomienia z przygotowaniem wejścia, TLS i wznowieniem inicjalizacji.
# Pełne wywołanie z katalogu repozytorium
# docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.bootstrap.yaml run --build --rm bootstrap
# Rozszerza bazowe usługi i wolumeny, zachowując ich nazwy i sieć. bootstrap.php
# obsługuje trzy tryby zależnie od entrypointu lub polecenia healthchecka.
# certificates zapisuje parę TLS na hoście, a bootstrap zapisuje brakujące dane
# w shop_data i bazie. Pliki źródłowe pozostają zamontowane tylko do odczytu.
services:
  certificates:
    image: prestashop-website:8.2.8
    platform: linux/amd64
    build:
      context: ../shop
    # Własny entrypoint omija instalator obrazu. Ten tryb waliduje źródła i TLS
    # przed startem bazy, korzystając wyłącznie z plików i rozszerzeń PHP.
    entrypoint: ["php", "/opt/shop/deploy/bootstrap.php", "--certificates"]
    environment:
      PS_DOMAIN: ${PS_DOMAIN:?Uzupełnij PS_DOMAIN}
    volumes:
      - .:/opt/shop/deploy:ro
      - ../scraper-results:/opt/shop/scraper-results:ro
      - type: bind
        source: ${TLS_CERT_DIR:?Uzupełnij TLS_CERT_DIR}
        target: /certs
        bind:
          create_host_path: true
    restart: "no"

  # Nieudane przygotowanie danych lub TLS zatrzymuje start zależnej bazy.
  # Warunek completed_successfully dotyczy usługi jednorazowej z kodem 0.
  db:
    depends_on:
      certificates:
        condition: service_completed_successfully

  shop:
    volumes:
      - .:/opt/shop/deploy:ro
    healthcheck:
      # Odczyt konfiguracji może tworzyć cache. Właściciel musi odpowiadać Apache.
      test: ["CMD", "su", "-s", "/bin/sh", "www-data", "-c", "php /opt/shop/deploy/bootstrap.php --check-shop"]
      # To stan zdrowia usługi shop. Bootstrap ma niezależny termin oczekiwania
      # na zakończenie instalacji i odpowiedź publicznego HTTPS.
      interval: 5s
      timeout: 5s
      retries: 180

  # Nginx uruchamia się po starcie kontenera shop. Może już przyjmować połączenia,
  # gdy instalator jeszcze pracuje. Rzeczywistą gotowość kontroluje bootstrap.
  nginx:
    depends_on:
      shop:
        condition: service_started
      certificates:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${TLS_CERT_DIR:?Uzupełnij TLS_CERT_DIR}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: true

  bootstrap:
    image: prestashop-website:8.2.8
    platform: linux/amd64
    build:
      context: ../shop
    # Właściciel plików odpowiada Apache. Dotyczy to cache, miniatur, modułu
    # cookies i dziennika inicjalizacji zapisywanych we wspólnym wolumenie.
    user: www-data
    entrypoint: ["php", "/opt/shop/deploy/bootstrap.php"]
    depends_on:
      shop:
        condition: service_started
      nginx:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      PS_DOMAIN: ${PS_DOMAIN:?Uzupełnij PS_DOMAIN}
      # Limit dotyczy gotowości instalatora i HTTPS przed importem katalogu.
      BOOTSTRAP_TIMEOUT: ${BOOTSTRAP_TIMEOUT:-900}
      PRESTASHOP_API_KEY: ${PRESTASHOP_API_KEY:-}
    volumes:
      - shop_data:/var/www/html
      - .:/opt/shop/deploy:ro
      # Stałe SOURCE_FILE i ścieżki publicznych CLI korzystają z /opt/shop.
      # /opt/shop/deploy udostępnia ten sam kod pod ścieżką entrypointu bootstrapu.
      - ./init:/opt/shop/init:ro
      - ../scraper-results:/opt/shop/scraper-results:ro
      - type: bind
        source: ${TLS_CERT_DIR:?Uzupełnij TLS_CERT_DIR}
        target: /certs
        read_only: true
    networks:
      - shop_network
    restart: "no"
