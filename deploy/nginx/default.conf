# Lokalny reverse proxy usługi nginx, montowany jako conf.d/default.conf.
# Czytany przy starcie Nginx po przygotowaniu pary localhost.crt i localhost.key.
# Port 80 przekierowuje na HTTPS, a port 443 kończy TLS i przekazuje żądania do shop:80.
# Współpracuje z PS_DOMAIN=localhost, certyfikatami z TLS_CERT_DIR i siecią Compose.
# Konfiguracja odpowiada za transport żądań i nagłówki rozpoznawane przez PrestaShop.
server {
    listen 80;
    server_name localhost;

    # Dyrektywa należy do tego serwera HTTP. Serwer HTTPS poniżej stanowi
    # odrębny kontekst i dziedziczy swój limit z nadrzędnej konfiguracji Nginx.
    client_max_body_size 32M;

    # Zachowanie request_uri utrzymuje ścieżkę i parametry zapytania podczas
    # przejścia klienta na kanoniczny adres lokalny.
    return 301 https://localhost$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://shop:80;

        # Host zachowuje domenę sklepu, a nagłówki forwarded informują aplikację
        # o HTTPS zakończonym na proxy mimo transportu HTTP do Apache.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }
}