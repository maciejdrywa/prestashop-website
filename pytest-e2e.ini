[pytest]
testpaths = tests/e2e
pythonpath = tests
addopts =
    --browser=chromium
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=tests/test-results/python
    --junitxml=tests/test-results/python/junit.xml
    --html=tests/playwright-report/python/index.html
    --self-contained-html
# Limit dotyczy całego wywołania scenariusza, nie pojedynczych etapów.
timeout = 300
timeout_func_only = true
timeout_method = thread
junit_logging = all
