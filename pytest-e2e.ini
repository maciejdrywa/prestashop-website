[pytest]
testpaths = tests/e2e
pythonpath = tests
addopts =
    --browser=chromium
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=tests/test-results/python
    --junitxml=tests/test-results/python/junit.xml
    --html=tests/playwright-report/python/index.html
    --self-contained-html
# Ostateczny bezpiecznik na zawieszenie: pytest-timeout przerywa proces, a raporty
# mogą wtedy nie zostać zapisane. Limit 300 s (E2E_MAX_SECONDS) egzekwuje conftest.py
# zwykłym błędem testu, bez utraty raportu JUnit/HTML, zrzutu ekranu i śladu.
# Obie wartości dotyczą całego wywołania scenariusza, nie pojedynczych etapów.
timeout = 360
timeout_func_only = true
timeout_method = thread
junit_logging = all
